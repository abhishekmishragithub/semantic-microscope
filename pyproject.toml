[project]
name = "semantic-microscope"
version = "0.1.0"
description = "Label every sentence of a document with calibrated probabilities from Jev, render as a heatmap."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pysbd>=0.3.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
microscope = "microscope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microscope"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
